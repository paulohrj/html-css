<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /*
        SELETORES PERSONALIZADOS
        #  = ID
        .  = CLASS
        :  = PSEUDO CLASS
        :: = PSEUDO ELEMENT
        >  = CHILDREN
        */

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: black;
            text-decoration: none;
            font-weight: bold;
        }

        /*a:visited {
            color: pink;
        }
            */

        a:hover {
            color: aqua;
            text-decoration: underline;
        }
        
        a:active {
            color: blueviolet;
        }

        /*a::after {
            content:' {link}';
            text-decoration: none;
            font-weight: normal;
            color: darkgrey;
        } */
        .especial {
            background-color: blue;
            color: white;
        }

        .especial::after {
            content: '⇐';
        }
        .especial::before {
            content: '⇒';
        }
    </style>
</head>
<body>
    <h1>Personalizando links</h1>
    <ul>
        <li><a href="https://github.com/gustavoguanabara" target="_blank">RepositórioGithub</a></li>
        <li><a href="https://www.youtube.com/cursoemvideo" target="_blank" class="especial">Canal youtube</a></li>
        <li><a href="https://www.cursoemvideo.com/" target="_blank" class="especial">Site curso em vídeo</a></li>
    </ul>
</body>
</html>
