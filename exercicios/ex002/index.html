<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <p>Voce pode escrever um
        parágrafo de qualquer jeito.
        Basta colocar tudo  
        no meio de tags &lt;p&gt; e &lt;/p&gt;
    </p>
    <p>
        Se precisar quebrar 
        o texto em algum lugar 
        específico <br> como esse,
        você pode usar a tag &lt;br/&gt;
    </p>
    <p>Vamos adicionar alguns símbolos especiais:
        &reg;
        &copy;
        &trade;
        &euro;
        &pound;
        &yen;
        &cent;
        &Delta;
        &uarr;
    </p>
    <p>Vamos adicionar alguns emojis: 
        &#x1F602;
        &#x1F4A3;
        &#x1F3CD;&#xFE0F;
    </p>
</body>
</html>
